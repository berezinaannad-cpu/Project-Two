<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#73d7f2">
  <title>Play with Lorry Jay</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <main class="home" id="home">
    <header class="home-title">
      <span class="title-star">★</span>
      <div><p>LEARN ENGLISH AND HAVE FUN!</p><h1>Play with <span>Lorry Jay</span></h1></div>
      <button class="sound-toggle home-sound" aria-label="Toggle sound">🔊 Sound</button>
    </header>

    <section class="cards" aria-label="English learning games">
      <article class="game-card card-match">
        <img src="assets/card-word-match.png" alt="Lorry Jay matches toy and transport cards">
        <div class="card-copy"><small>LEARN THE WORDS</small><h2>Word Match</h2><p>Toys and transport</p><button class="play" data-game="match">Play <span>▶</span></button></div>
      </article>
      <article class="game-card card-sound">
        <img src="assets/card-sound-detective.png" alt="Lorry Jay listens to English numbers">
        <div class="card-copy"><small>LISTEN AND FIND NUMBERS</small><h2>Sound Detective</h2><p>Can you hear the number?</p><button class="play" data-game="sound">Play <span>▶</span></button></div>
      </article>
      <article class="game-card card-spell">
        <img src="assets/card-unscramble.png" alt="Lorry Jay plays with letter tiles">
        <div class="card-copy"><small>SPELL THE WORDS</small><h2>Unscramble</h2><p>Put the letters in order</p><button class="play" data-game="unscramble">Play <span>▶</span></button></div>
      </article>
    </section>
  </main>

  <section class="game-screen" id="gameScreen" aria-hidden="true">
    <header class="game-header">
      <button class="back">← <span>Main page</span></button>
      <div class="game-name"></div>
      <button class="sound-toggle game-sound" aria-label="Toggle sound">🔊 Sound</button>
    </header>
    <div class="game-wrap">
      <div class="game-meta">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span id="secondaryLabel">LEVEL</span><strong id="secondary">1 / 3</strong></div>
        <div><span>BEST</span><strong id="best">0</strong></div>
      </div>
      <div id="gameArea"></div>
      <aside class="jay-coach"><img src="assets/lorry-jay.png" alt="Lorry Jay"><p id="jaySpeech">Let's play!</p></aside>
      <div class="game-message" id="gameMessage">
        <img src="assets/lorry-jay.png" alt="Happy Lorry Jay">
        <h2></h2><p></p>
        <div class="message-actions"><button class="primary restart">Choose a level</button><button class="secondary message-home">Back to the main page</button></div>
      </div>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
